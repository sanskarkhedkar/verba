name: verba
description: "Translation-first AI language learning app."
publish_to: 'none'
version: 2.0.0+34

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_analytics: ^12.3.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0
  firebase_remote_config: ^6.4.0
  firebase_storage: ^13.3.0
  cloud_functions: ^6.3.1

  # Local notifications (daily reminders)
  flutter_local_notifications: ^17.2.3
  flutter_timezone: ^4.1.1
  timezone: ^0.9.4

  # AI / APIs
  http: ^1.2.2

  # Navigation
  go_router: ^14.6.3

  # Audio recording & playback
  record: ^6.2.0
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0

  # Authentication
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.1

  # Payments
  purchases_flutter: ^8.3.4
  purchases_ui_flutter: ^8.3.4

  # Image / OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1

  # Local Storage
  shared_preferences: ^2.3.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1

  # Google Fonts (replaces local font assets for now)
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/App Logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/rive/
    - assets/lottie/
    - assets/images/
    - .env
